<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevFest Live 3D Scene</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #202124; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        #overlay { position: absolute; top: 20px; left: 20px; color: white; pointer-events: none; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); z-index: 10; }
        h1 { margin: 0; font-size: 3em; color: #4285F4; }
        #notification { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 5em; font-weight: bold; opacity: 0; transition: opacity 0.5s; text-shadow: 0 0 20px #EA4335; pointer-events: none; text-align: center; width: 100%; z-index: 10; }
    </style>
</head>
<body>
    <div id="overlay">
        <h1>DevFest Live!</h1>
        <p>Go to /interact.html to join the fun!</p>
    </div>
    <div id="notification"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#202124');
        scene.fog = new THREE.Fog('#202124', 10, 50);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 10, 5);
        light.castShadow = true;
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshStandardMaterial({ color: '#f8f9fa' });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const objects = [];
        const devFestColors = ['#4285F4', '#EA4335', '#FBBC05', '#34A853'];

        function createCube(x, y, z) {
            const color = devFestColors[Math.floor(Math.random() * devFestColors.length)];
            const geo = new THREE.BoxGeometry();
            const mat = new THREE.MeshStandardMaterial({ color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.userData = { velocityY: 0, bouncing: false };
            scene.add(mesh);
            objects.push(mesh);
            return mesh;
        }

        for (let i = 0; i < 10; i++) {
            createCube(Math.random() * 10 - 5, 0.5, Math.random() * 10 - 5);
        }

        function spawnConfetti() {
            for (let i = 0; i < 50; i++) {
                const c = createCube(Math.random() * 20 - 10, 15 + Math.random() * 5, Math.random() * 20 - 10);
                c.scale.set(0.2, 0.2, 0.2);
                c.userData.velocityY = -Math.random() * 0.2;
            }
        }

        function spawnHotSauce() {
            const geo = new THREE.CylinderGeometry(0.5, 0.5, 2, 16);
            const mat = new THREE.MeshStandardMaterial({ color: '#EA4335' });
            const bottle = new THREE.Mesh(geo, mat);
            bottle.position.set(Math.random() * 10 - 5, 10, Math.random() * 10 - 5);
            bottle.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
            bottle.castShadow = true;
            bottle.userData = { velocityY: 0 };
            scene.add(bottle);
            objects.push(bottle);
        }

        function makeBounce() {
            objects.forEach(obj => {
                if (obj.position.y < 2) {
                    obj.userData.velocityY = 0.3 + Math.random() * 0.2;
                }
            });
        }

        function showNotification(text) {
            const notif = document.getElementById('notification');
            notif.textContent = text;
            notif.style.opacity = 1;
            setTimeout(() => notif.style.opacity = 0, 2000);
        }

        const gravity = -0.01;

        function animate() {
            requestAnimationFrame(animate);

            objects.forEach(obj => {
                obj.userData.velocityY += gravity;
                obj.position.y += obj.userData.velocityY;
                
                obj.rotation.x += 0.01;
                obj.rotation.y += 0.02;

                let height = 1;
                if (obj.geometry.parameters && obj.geometry.parameters.height) {
                    height = obj.geometry.parameters.height * obj.scale.y;
                }
                
                if (obj.position.y < height/2) {
                    obj.position.y = height/2;
                    obj.userData.velocityY = Math.abs(obj.userData.velocityY) * 0.5;
                }
            });

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Polling
        let lastCount = 0;
        let isFirstPoll = true;

        

        function handleAction(action, teamName) {
            const tName = teamName || 'Anonymous';
            showNotification(`${tName} used ${action}!`);
            if (action === 'confetti') spawnConfetti();
            else if (action === 'throw_hot_sauce') spawnHotSauce();
            else if (action === 'make_it_bounce') makeBounce();
            else spawnConfetti();
        }

        pollInteractions();

    </script>
</body>
</html>
